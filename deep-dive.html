<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Table — Deep Dive</title>
<style>
:root{
  --bg:#000000;
  --panel: rgba(255,255,255,0.045);
  --panel-hover: rgba(255,255,255,0.07);
  --line: rgba(255,255,255,0.1);
  --line-soft: rgba(255,255,255,0.06);
  --text:#ffffff;
  --text-dim: rgba(255,255,255,0.6);
  --text-faint: rgba(255,255,255,0.4);
  --text-ghost: rgba(255,255,255,0.22);
  --gold:#D4AF37;
  --gold-bright:#e8cf7a;
  --blue:#38bdf8;
  --win:#3ecf8e;
  --loss:#ef4444;
  --ink:#0a0a0a;
  --w:#F4EFDD; --u:#3E7FC1; --b:#4A4750; --r:#B8402F; --g:#3C7A4C; --c:#9A958A;
  --radius:20px;
  --radius-sm:14px;
  --shadow: 0 10px 30px rgba(0,0,0,0.6);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height:1.5;
  min-height:100vh;
}

::selection{ background:var(--gold); color:var(--ink); }

a{ color:inherit; }

.wrap{ max-width:1180px; margin:0 auto; padding:0 24px; }

h1,h2,h3{ font-family:inherit; font-weight:900; margin:0; letter-spacing:-0.01em; }

/* ---------- Nav ---------- */
.nav{
  position:sticky; top:0; z-index:50;
  background:rgba(0,0,0,0.9);
  backdrop-filter: blur(14px);
  border-bottom:1px solid var(--line);
}
.nav-inner{
  max-width:1180px; margin:0 auto; padding:14px 24px;
  display:flex; align-items:center; gap:22px; flex-wrap:wrap;
}
.nav-mark{
  font-weight:900; font-size:14px; text-transform:uppercase; letter-spacing:.16em; color:var(--text);
  display:flex; align-items:center; gap:9px; white-space:nowrap;
}
.nav-mark .dot{ width:7px;height:7px;border-radius:50%;background:var(--gold); box-shadow:0 0 10px var(--gold);}
.nav-links{ display:flex; gap:4px; flex-wrap:wrap; margin-left:auto; }
.nav-links a{
  font-size:11px; text-decoration:none; color:var(--text-dim);
  padding:8px 14px; border-radius:999px; transition:all .18s ease;
  font-weight:900; letter-spacing:.08em; text-transform:uppercase;
  background:var(--panel); border:1px solid transparent;
}
.nav-links a:hover, .nav-links a:focus-visible{ background:var(--panel-hover); color:var(--text); border-color:var(--line); outline:none; }

/* ---------- Hero ---------- */
.hero{
  padding:72px 24px 56px; position:relative; overflow:hidden;
}
.hero-pips{ position:absolute; inset:0; pointer-events:none; opacity:0.4; }
.floatpip{
  position:absolute; border-radius:50%; opacity:0.12; filter:blur(1px);
  animation: drift 14s ease-in-out infinite;
}
@keyframes drift{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-18px) } }
@media (prefers-reduced-motion: reduce){ .floatpip{ animation:none; } html{scroll-behavior:auto;} }

.hero-inner{ max-width:1180px; margin:0 auto; position:relative; }
.eyebrow{
  font-size:11px; letter-spacing:.3em; text-transform:uppercase; font-weight:900;
  color:var(--text-faint); margin-bottom:18px; display:flex; align-items:center; gap:10px;
}
.eyebrow .line{ width:28px; height:1px; background:var(--gold); opacity:.7; }
.hero h1{
  font-size:clamp(34px, 5.6vw, 58px); line-height:1.05; color:var(--text);
  max-width:820px; font-weight:900;
}
.hero h1 em{ font-style:normal; color:var(--gold-bright); }
.hero p.sub{
  margin-top:18px; max-width:560px; font-size:15.5px; color:var(--text-dim);
}
.hero-stats{
  margin-top:44px; display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px; max-width:920px;
}
.hero-stat{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-sm); padding:18px 20px; }
.hero-stat .num{ font-size:28px; font-weight:900; color:var(--text); text-shadow:0 2px 16px rgba(0,0,0,0.6); }
.hero-stat .lbl{ font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.14em; margin-top:5px; font-weight:900; }

/* ---------- Sections ---------- */
section{ padding:64px 0; border-top:1px solid var(--line-soft); }
.section-head{ display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:32px; }
.section-head h2{ font-size:24px; color:var(--text); font-weight:900; }
.section-head .idx{ color:var(--gold); font-size:11px; letter-spacing:.18em; font-weight:900; text-transform:uppercase; }
.section-desc{ color:var(--text-dim); font-size:14px; max-width:560px; margin-top:6px; }

/* ---------- Cards / panels ---------- */
.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  backdrop-filter: blur(16px);
  position:relative;
}
.grid{ display:grid; gap:14px; }
.grid-2{ grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); }
.grid-3{ grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }

/* Leaderboard */
.leader-card{ padding:20px; display:flex; gap:16px; align-items:center; }
.life-badge{
  flex:none; width:62px; height:62px; border-radius:50%;
  background:rgba(255,255,255,0.06);
  border:2px solid var(--gold);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  box-shadow: inset 0 0 14px rgba(0,0,0,0.5);
  overflow:hidden;
}
.life-badge .n{ font-weight:900; font-size:24px; color:var(--text); line-height:1; text-shadow:0 1px 10px rgba(0,0,0,0.6); }
.leader-info{ flex:1; min-width:0; }
.leader-name{ font-weight:900; font-size:16px; color:var(--text); }
.leader-pct{ font-weight:900; font-size:28px; color:var(--text); line-height:1.1; margin-top:6px; text-shadow:0 2px 14px rgba(0,0,0,0.5); }
.leader-sub{ font-size:12px; color:var(--text-dim); margin-top:4px; }
.rank-tag{
  font-size:10px; color:var(--ink); background:var(--gold);
  border-radius:999px; padding:2px 8px; font-weight:900; margin-right:8px; letter-spacing:.04em;
}
.bar-track{ height:6px; border-radius:999px; background:rgba(255,255,255,0.08); margin-top:10px; overflow:hidden; }
.bar-fill{ height:100%; border-radius:999px; background:linear-gradient(90deg, var(--blue), var(--gold)); }

/* Deck art tiles */
.deck-tile{
  position:relative; overflow:hidden; border-radius:var(--radius);
  aspect-ratio: 4/3; background:var(--panel); border:1px solid var(--line);
  background-size:cover; background-position:center;
  display:flex; flex-direction:column; justify-content:space-between;
}
.deck-tile::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(0,0,0,0.05) 25%, rgba(0,0,0,0.9) 100%);
  pointer-events:none;
}
.deck-tile.no-art::after{ background:none; }
.deck-tile .tile-top{ position:relative; z-index:1; display:flex; justify-content:space-between; align-items:flex-start; padding:10px; }
.deck-tile .tile-bottom{ position:relative; z-index:1; padding:10px 14px 14px; }
.deck-tile .tile-pos{
  font-size:11px; font-weight:900; color:var(--gold); background:rgba(0,0,0,0.6);
  backdrop-filter:blur(6px); border-radius:999px; padding:3px 9px; letter-spacing:.03em;
}
.deck-tile .tile-pct{
  font-size:14px; font-weight:900; color:var(--text); background:rgba(0,0,0,0.6);
  backdrop-filter:blur(6px); border-radius:999px; padding:3px 10px;
}
.deck-tile .tile-name{ font-weight:900; font-size:15px; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,0.9); }
.deck-tile .tile-meta{ font-size:10.5px; color:rgba(255,255,255,0.78); margin-top:3px; text-shadow:0 1px 6px rgba(0,0,0,0.9); }

/* Mana pips */
.pips{ display:inline-flex; gap:3px; vertical-align:middle; }
.pip{
  width:17px; height:17px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
  font-size:9px; font-weight:900; color:var(--ink);
  border:1px solid rgba(0,0,0,0.35); flex:none;
}

/* Table-ish list rows */
.rowlist{ display:flex; flex-direction:column; }
.rowlist .r{
  display:grid; grid-template-columns: 28px 1fr auto; gap:12px; align-items:center;
  padding:13px 20px; border-top:1px solid var(--line-soft);
}
.rowlist .r:first-child{ border-top:none; }
.rowlist .r .pos{ color:var(--gold); font-size:12px; font-weight:900; }
.rowlist .r .main{ min-width:0; }
.rowlist .r .name{ font-weight:900; font-size:15px; color:var(--text); }
.rowlist .r .meta{ font-size:11.5px; color:var(--text-dim); margin-top:3px; }
.rowlist .r .stat{ text-align:right; }
.rowlist .r .stat .big{ font-size:16px; color:var(--text); font-weight:900; }
.rowlist .r .stat .small{ font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.08em; font-weight:900; }

/* Seat / mulligan bars */
.hbar-row{ display:flex; align-items:center; gap:14px; padding:10px 0; }
.hbar-label{ width:120px; flex:none; font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; font-weight:900; }
.hbar-track{ flex:1; height:20px; background:rgba(255,255,255,0.06); border-radius:999px; overflow:hidden; position:relative; }
.hbar-fill{ height:100%; border-radius:999px; background:linear-gradient(90deg, var(--blue), var(--gold)); display:flex; align-items:center; }
.hbar-val{ width:56px; flex:none; text-align:right; font-size:13px; color:var(--text); font-weight:900; }

/* Awards */
.award-card{ padding:22px; }
.award-card .k{ font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.14em; font-weight:900; }
.award-card .v{ font-size:22px; color:var(--text); margin-top:9px; font-weight:900; text-shadow:0 2px 16px rgba(0,0,0,0.6); }
.award-card .d{ font-size:12px; color:var(--text-dim); margin-top:6px; }

/* trend */
.trend-wrap{ padding:24px 20px 16px; }
.trend-bars{ display:flex; align-items:flex-end; gap:6px; height:140px; }
.tbar{ flex:1; background:linear-gradient(180deg, var(--gold-bright), var(--blue)); border-radius:4px 4px 0 0; position:relative; min-width:8px; }
.tbar .tt{
  position:absolute; bottom:100%; left:50%; transform:translateX(-50%); margin-bottom:6px;
  font-size:10px; font-weight:900; color:var(--text); white-space:nowrap; opacity:0; transition:opacity .15s;
  background:rgba(0,0,0,0.9); padding:3px 7px; border-radius:999px; border:1px solid var(--line);
}
.tbar:hover .tt, .tbar:focus-visible .tt, .tbar.tt-open .tt{ opacity:1; }
.trend-axis{ display:flex; gap:6px; margin-top:8px; }
.trend-axis span{ flex:1; text-align:center; font-size:9.5px; color:var(--text-faint); min-width:8px; font-weight:700; }

/* rivalry */
.rivalry-card{ padding:20px; }
.rivalry-names{ display:flex; align-items:center; justify-content:space-between; font-weight:900; font-size:15px; }
.rivalry-vs{ font-size:10px; color:var(--text-faint); font-weight:900; text-transform:uppercase; letter-spacing:.08em; }
.rivalry-track{ display:flex; height:10px; border-radius:999px; overflow:hidden; margin-top:12px; background:rgba(255,255,255,0.06); }
.rivalry-a{ background:var(--gold); }
.rivalry-b{ background:var(--blue); }
.rivalry-meta{ display:flex; justify-content:space-between; margin-top:8px; font-size:11px; color:var(--text-dim); font-weight:700; }

/* toggle */
.toggle{ display:inline-flex; background:var(--panel); border-radius:999px; padding:3px; border:1px solid var(--line); }
.toggle button{
  border:none; background:transparent; color:var(--text-dim);
  font-size:11px; font-weight:900; text-transform:uppercase; letter-spacing:.06em;
  padding:8px 16px; border-radius:999px; cursor:pointer; transition:all .15s;
}
.toggle button.active{ background:var(--gold); color:var(--ink); }
.toggle button:focus-visible{ outline:2px solid var(--gold-bright); outline-offset:2px; }

/* state screens */
.state-screen{ min-height:70vh; display:flex; align-items:center; justify-content:center; flex-direction:column; padding:40px 24px; text-align:center; }
.spinner{
  width:32px; height:32px; border-radius:50%; border:2px solid rgba(255,255,255,0.12); border-top-color:var(--gold);
  animation:spin 0.9s linear infinite; margin-bottom:20px;
}
@keyframes spin{ to{ transform:rotate(360deg); } }
.state-screen h2{ font-size:18px; color:var(--text); font-weight:900; text-transform:uppercase; letter-spacing:.04em; }
.state-screen p{ color:var(--text-dim); max-width:460px; margin-top:10px; font-size:13.5px; }
.retry-btn{
  margin-top:20px; background:var(--gold); color:var(--ink); border:none; padding:11px 22px;
  border-radius:999px; font-weight:900; cursor:pointer; font-family:inherit; font-size:12px;
  text-transform:uppercase; letter-spacing:.08em;
}
.retry-btn:hover{ background:var(--gold-bright); }
code.inline{ background:rgba(255,255,255,0.06); padding:2px 7px; border-radius:6px; font-size:12px; color:var(--gold-bright); }

footer{ padding:40px 24px 60px; text-align:center; color:var(--text-faint); font-size:12px; }
footer .refresh-btn{
  background:var(--panel); border:1px solid var(--line); color:var(--text);
  padding:9px 18px; border-radius:999px; font-size:11px; font-weight:900; text-transform:uppercase; letter-spacing:.08em;
  cursor:pointer; margin-top:14px;
}
footer .refresh-btn:hover{ background:var(--panel-hover); }

/* matrices & averages tables (Deep Dive page) */
.avg-table{ display:flex; flex-direction:column; }
.avg-table .r{
  display:grid; grid-template-columns: 1fr repeat(3, 90px); gap:10px; align-items:center;
  padding:12px 20px; border-top:1px solid var(--line-soft);
}
.avg-table .r:first-child{ border-top:none; }
.avg-table .r.head{ font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-faint); font-weight:900; padding-bottom:8px; }
.avg-table .r .name{ font-weight:900; font-size:14px; color:var(--text); }
.avg-table .r .meta{ font-size:11px; color:var(--text-dim); margin-top:2px; }
.avg-table .r .val{ text-align:right; font-weight:900; font-size:14px; color:var(--text); }
.avg-table .r .val.win{ color:var(--win); }
.avg-table .r .val.loss{ color:var(--loss); }

.matrix-wrap{ overflow-x:auto; }
.matrix{ border-collapse:collapse; width:100%; min-width:520px; }
.matrix th, .matrix td{ padding:9px 10px; text-align:center; font-size:12px; border:1px solid var(--line-soft); }
.matrix th{ font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); font-weight:900; background:rgba(255,255,255,0.03); }
.matrix th.rowhead{ text-align:left; color:var(--text); font-size:12px; text-transform:none; letter-spacing:0; font-weight:900; white-space:nowrap; }
.matrix td{ color:var(--text-dim); font-weight:700; }
.matrix td.self{ background:rgba(255,255,255,0.02); color:var(--text-ghost); }
.matrix td.empty{ color:var(--text-ghost); }

@media (max-width:640px){
  .nav-links{ display:none; }
  .rowlist .r{ grid-template-columns: 20px 1fr auto; padding:12px 16px; }
  .hbar-label{ width:88px; font-size:10.5px; }
  .avg-table .r{ grid-template-columns: 1fr repeat(3, 64px); padding:12px 14px; font-size:12px; }
}
</style>
</head>
<body>

<div id="app">
  <div class="state-screen" id="loadingScreen">
    <div class="spinner"></div>
    <h2>Crunching the deep numbers…</h2>
    <p>Pulling live results from the scorekeeping sheet.</p>
  </div>
</div>

<template id="errorTemplate">
  <div class="state-screen">
    <h2>Couldn't reach the sheet</h2>
    <p>
      This page reads live from your Google Sheet, which needs to be shared as
      <strong>"Anyone with the link — Viewer."</strong>
      In the sheet, click <em>Share</em>, set general access to "Anyone with the link," then reload this page.
    </p>
    <p style="margin-top:14px;">Sheet ID in use: <code class="inline">__SHEET_ID__</code></p>
    <button class="retry-btn" onclick="location.reload()">Try again</button>
  </div>
</template>

<script>
const SHEET_ID = '18_9UkJ3MAsNw4ByOGFDqOBE2u1gnpxQSR3tPi-_9i3I';
const GAME_TAB = 'Game_Summary';
const PLAYER_TAB = 'Player_Performance';

// Separate spreadsheet, one tab per player, each tab a deck list for that
// player. A row with Deck Name "PFP" (Exclude checked, so it never shows up
// as an actual deck) holds that player's profile picture in Art_URL.
const PFP_SHEET_ID = '1HfTUoLol3h1DmDeWTDsUqYTjq99SV9NGi-CmB3Wk89g';

const MANA_COLORS = { W:'#F4EFDD', U:'#3E7FC1', B:'#4A4750', R:'#B8402F', G:'#3C7A4C', C:'#9A958A' };

function gvizUrl(sheetName, sheetId){
  return `https://docs.google.com/spreadsheets/d/${sheetId || SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
}

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ','){ row.push(field); field=''; }
      else if (c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if (c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length===1 && r[0] !== ''));
}

// Normalize a header/candidate name for tolerant matching: lowercase,
// strip everything but letters+digits. This absorbs the exact kind of
// sheet drift we've hit before (typos like "Muilligan_Type", inconsistent
// truncation like "Opening_Lan", stray spaces, underscore-vs-space, casing)
// without needing to hardcode every specific variant by hand.
function normKey(s){ return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }

function rowsToObjects(rows){
  const headers = rows[0].map(h => h.trim());
  const headerByNorm = {};
  headers.forEach(h => { if (!(normKey(h) in headerByNorm)) headerByNorm[normKey(h)] = h; });
  const objs = rows.slice(1).map(r => {
    const obj = {};
    headers.forEach((h,i) => obj[h] = (r[i] !== undefined ? r[i].trim() : ''));
    return obj;
  });
  return { rows: objs, headerByNorm };
}

// Tolerant field getter: tries each candidate name against the actual sheet
// headers (case/spacing/typo-insensitive) and returns the first that exists,
// rather than requiring an exact string match. Use this for any column whose
// real header spelling in the live sheet might drift from what we expect.
function field(row, headerByNorm, ...candidates){
  for (const c of candidates){
    const h = headerByNorm[normKey(c)];
    if (h !== undefined && row[h] !== undefined) return row[h];
  }
  return undefined;
}

async function fetchSheet(name, sheetId){
  const res = await fetch(gvizUrl(name, sheetId));
  if (!res.ok) throw new Error('fetch-failed');
  const text = await res.text();
  if (text.trim().startsWith('<')) throw new Error('not-public');
  return rowsToObjects(parseCSV(text));
}

// Fetches each player's own tab from the PFP spreadsheet (tab name === player
// name) and pulls the Art_URL off the row whose Deck Name is "PFP". Any
// individual player's fetch is allowed to fail silently (no tab, no PFP row,
// network hiccup) — that player just falls back to an initial-letter avatar
// rather than breaking the whole page. `debug` records exactly what happened
// per player so failures are diagnosable instead of just silently absent.
async function fetchPlayerPfps(playerNames){
  const map = {};
  const debug = [];
  await Promise.all(playerNames.map(async name => {
    const url = gvizUrl(name, PFP_SHEET_ID);
    const rec = { name, url };
    try{
      const res = await fetch(url);
      rec.httpStatus = res.status;
      if (!res.ok){ rec.result = 'fetch-not-ok'; debug.push(rec); return; }
      const text = await res.text();
      rec.textPreview = text.slice(0, 120);
      if (text.trim().startsWith('<')){ rec.result = 'not-public-or-tab-missing (got HTML not CSV)'; debug.push(rec); return; }
      const { rows, headerByNorm } = rowsToObjects(parseCSV(text));
      rec.headersSeen = Object.values(headerByNorm);
      rec.rowCount = rows.length;
      const pfpRow = rows.find(r => {
        const dn = field(r, headerByNorm, 'Deck Name', 'DeckName', 'Deck');
        return (dn || '').trim().toLowerCase() === 'pfp';
      });
      if (!pfpRow){ rec.result = 'no row with Deck Name = PFP'; debug.push(rec); return; }
      const pfpUrl = field(pfpRow, headerByNorm, 'Art_URL', 'ArtURL');
      if (!pfpUrl || !pfpUrl.trim()){ rec.result = 'PFP row found but Art_URL empty'; debug.push(rec); return; }
      map[name] = pfpUrl.trim();
      rec.result = 'OK';
      rec.resolvedUrl = pfpUrl.trim();
      debug.push(rec);
    } catch(e){
      rec.result = 'threw: ' + (e && e.message);
      debug.push(rec);
    }
  }));
  return { map, debug };
}

function mean(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null; }
function fmt1(n){ return n === null || n === undefined || isNaN(n) ? '—' : n.toFixed(1); }
function pct(n){ return n === null || isNaN(n) ? '—' : Math.round(n*100) + '%'; }

function pipsHTML(colorId){
  if (!colorId) return `<span class="pips"><span class="pip" style="background:${MANA_COLORS.C}">C</span></span>`;
  const chars = colorId.replace(/[^WUBRG]/gi,'').toUpperCase().split('');
  const uniq = [...new Set(chars)];
  if (!uniq.length) return `<span class="pips"><span class="pip" style="background:${MANA_COLORS.C}">C</span></span>`;
  return `<span class="pips">` + uniq.map(c => `<span class="pip" style="background:${MANA_COLORS[c]}">${c}</span>`).join('') + `</span>`;
}

// Minimal escape for a URL dropped into a double-quoted HTML attribute.
// Escape both quote styles for a URL dropped into an HTML attribute value:
// the attribute itself is double-quoted, but the value also gets wrapped in
// CSS url('...') using single quotes, so either character breaking loose
// would truncate the attribute early.
function escUrl(u){ return String(u || '').replace(/"/g, '%22').replace(/'/g, '%27'); }

function monthLabel(ts){
  const d = new Date(ts.replace(' ','T'));
  if (isNaN(d)) return null;
  return d.toLocaleString('en-US', { month:'short', year:'2-digit' });
}

async function init(){
  let gamesData, perfData;
  try{
    [gamesData, perfData] = await Promise.all([fetchSheet(GAME_TAB), fetchSheet(PLAYER_TAB)]);
    if (!gamesData.rows.length || !perfData.rows.length) throw new Error('empty');
  } catch(e){
    const tpl = document.getElementById('errorTemplate').innerHTML.replace('__SHEET_ID__', SHEET_ID);
    document.getElementById('app').innerHTML = tpl;
    return;
  }
  await render(gamesData, perfData);
}

function render(gamesData, perfData){ return renderAsync(gamesData, perfData); }
async function renderAsync(gamesData, perfData){
  const gH = gamesData.headerByNorm, pH = perfData.headerByNorm;
  let games = gamesData.rows, perf = perfData.rows;

  // ---------- normalize ----------
  games = games.filter(g => g.GameID);
  perf = perf.filter(p => p.GameID && p.Player);
  games.forEach(g => { g.End_Turn = parseFloat(g.End_Turn) || null; });

  // Winner detection is NOT derived from Player_Performance's Turn_Died text.
  // That field turns out to be inconsistently written across the sheet's
  // history — sometimes literally "win", sometimes just left blank for the
  // winner — so no single string match reliably identifies a winning row.
  // Game_Summary's GameID -> Winner_Player pairing has proven reliable
  // throughout (it's what powers Awards/Reigning Champion correctly), so we
  // cross-reference against that instead: a Player_Performance row is a win
  // iff its (GameID, Player) matches a (GameID, Winner_Player) in Game_Summary.
  // GameID/Player are matched case- and whitespace-insensitively so a stray
  // space or casing difference between the two tabs can't silently break the
  // join the way the Turn_Died text match did.
  const pairKey = (gameId, player) => normKey(gameId) + '|||' + normKey(player);
  const winnerPairs = new Set(
    games.filter(g => g.Winner_Player).map(g => pairKey(g.GameID, g.Winner_Player))
  );

  perf.forEach(p => {
    p.Opening_Lands = parseFloat(field(p, pH, 'Opening_Lands', 'Opening_Lan')) || null;
    p.End_Lands = parseFloat(p.End_Lands) || null;
    p.End_Rocks = p.End_Rocks === '' ? null : parseFloat(p.End_Rocks);
    p.End_Dorks = p.End_Dorks === '' ? null : parseFloat(p.End_Dorks);
    const turnDiedRaw = field(p, pH, 'Turn_Died');
    p.isWin = winnerPairs.has(pairKey(p.GameID, p.Player));
    p.turnDiedNum = p.isWin ? null : (parseFloat(turnDiedRaw) || null);
    p.SeatNum = parseFloat(field(p, pH, 'Seat_Position')) || null;
    p.ArtURL = field(p, pH, 'Art_URL', 'ArtURL') || '';
  });

  // Guest players don't count toward any stats: excluding their rows here
  // cascades cleanly into every derived stat below (leaderboard, decks,
  // colors, seats, rivalries) since they all build from this `perf` array.
  const isGuest = name => (name || '').trim().toLowerCase() === 'guest';
  perf = perf.filter(p => !isGuest(p.Player));

  // Games a guest won are excluded specifically from person-attributed
  // awards (fastest win / longest grind / reigning champion) — crediting
  // "Guest" as a standing record doesn't mean anything. Table-wide facts
  // (total games, avg turn, seat rates, mulligan habits, monthly trend)
  // still include every logged game regardless of who won it.
  const gamesNonGuestWin = games.filter(g => !isGuest(g.Winner_Player));

  const totalGames = games.length;
  const players = [...new Set(perf.map(p => p.Player))].filter(Boolean);
  const decks = [...new Set(perf.map(p => p.Deck))].filter(Boolean);

  // ---------- players (base, needed for deck color lookups etc.) ----------
  const playerStats = players.map(name => {
    const rows = perf.filter(p => p.Player === name);
    const wins = rows.filter(p => p.isWin).length;
    const gamesPlayed = rows.length;
    return { name, gamesPlayed, wins, winRate: gamesPlayed ? wins/gamesPlayed : 0 };
  }).filter(p => p.gamesPlayed > 0)
    .sort((a,b) => b.winRate - a.winRate || b.gamesPlayed - a.gamesPlayed);

  // ---------- decks (base) ----------
  const deckStats = decks.map(name => {
    const rows = perf.filter(p => p.Deck === name);
    const wins = rows.filter(p=>p.isWin).length;
    const gamesPlayed = rows.length;
    const colorId = rows.find(r=>r.Color_ID)?.Color_ID || '';
    const owner = rows.find(r=>r.Owner)?.Owner || rows[0]?.Player || '';
    return { name, owner, gamesPlayed, wins, winRate: gamesPlayed ? wins/gamesPlayed : 0, colorId };
  }).filter(d => d.gamesPlayed > 0)
    .sort((a,b) => b.winRate - a.winRate || b.gamesPlayed - a.gamesPlayed);
  const deckColorById = Object.fromEntries(deckStats.map(d => [d.name, d.colorId]));

  // ---------- turn-based lookups ----------
  const gamesById = {};
  games.forEach(g => { gamesById[g.GameID] = g; });
  perf.forEach(p => { p.gameEndTurn = gamesById[p.GameID]?.End_Turn ?? null; });

  // ---------- turn averages: how long games run for each player/deck, split
  // by how the game ended for them (won vs. eliminated) ----------
  function turnAverages(names, rowsFor){
    return names.map(name => {
      const rows = rowsFor(name);
      const allEndTurns = rows.map(r=>r.gameEndTurn).filter(x=>x!=null);
      const winTurns = rows.filter(r=>r.isWin).map(r=>r.gameEndTurn).filter(x=>x!=null);
      const lossTurns = rows.filter(r=>!r.isWin).map(r=>r.turnDiedNum).filter(x=>x!=null);
      return { name, games: rows.length, avgGameLen: mean(allEndTurns), avgWinTurn: mean(winTurns), avgLossTurn: mean(lossTurns) };
    }).filter(x=>x.games>0).sort((a,b)=> b.games - a.games);
  }
  const playerTurnAvgs = turnAverages(players, name => perf.filter(p=>p.Player===name));
  const deckTurnAvgs = turnAverages(decks, name => perf.filter(p=>p.Deck===name));

  // ---------- head-to-head: every player pair (not capped) ----------
  const byGameP = {};
  perf.forEach(p => { (byGameP[p.GameID] = byGameP[p.GameID] || []).push(p.Player); });
  const winnerByGame = {};
  games.forEach(g => winnerByGame[g.GameID] = g.Winner_Player);
  const h2hMap = {};
  Object.entries(byGameP).forEach(([gid, plist]) => {
    const uniq = [...new Set(plist)];
    for (let i=0;i<uniq.length;i++) for (let j=i+1;j<uniq.length;j++){
      const [a,b] = [uniq[i], uniq[j]].sort();
      const key = a+'|||'+b;
      if (!h2hMap[key]) h2hMap[key] = { a, b, games:0, aWins:0, bWins:0 };
      h2hMap[key].games++;
      const w = winnerByGame[gid];
      if (w === a) h2hMap[key].aWins++;
      else if (w === b) h2hMap[key].bWins++;
    }
  });
  const playerH2HMatrix = players.map(rowName => ({
    name: rowName,
    cells: players.map(colName => {
      if (rowName === colName) return { self:true };
      const [a,b] = [rowName, colName].sort();
      const rec = h2hMap[a+'|||'+b];
      const decisive = rec ? rec.aWins + rec.bWins : 0;
      if (!decisive) return { empty:true };
      const rowWins = rowName === rec.a ? rec.aWins : rec.bWins;
      return { winRate: rowWins/decisive, games: rec.games, decisive };
    })
  }));

  // ---------- deck rivalries: every pair with 2+ shared games ----------
  const byGameD = {};
  perf.forEach(p => { (byGameD[p.GameID] = byGameD[p.GameID] || []).push(p.Deck); });
  const winnerDeckByGame = {};
  games.forEach(g => winnerDeckByGame[g.GameID] = g.Winner_Deck);
  const deckPairMap = {};
  Object.entries(byGameD).forEach(([gid, dlist]) => {
    const uniq = [...new Set(dlist)];
    for (let i=0;i<uniq.length;i++) for (let j=i+1;j<uniq.length;j++){
      const [a,b] = [uniq[i], uniq[j]].sort();
      const key = a+'|||'+b;
      if (!deckPairMap[key]) deckPairMap[key] = { a, b, games:0, aWins:0, bWins:0 };
      deckPairMap[key].games++;
      const w = winnerDeckByGame[gid];
      if (w === a) deckPairMap[key].aWins++;
      else if (w === b) deckPairMap[key].bWins++;
    }
  });
  const deckRivalries = Object.values(deckPairMap).filter(r=>r.games>=2).sort((a,b)=> b.games-a.games).slice(0,15);

  // ---------- ramp efficiency: mana sources per turn survived ----------
  perf.forEach(p => {
    const turnsAlive = p.isWin ? p.gameEndTurn : p.turnDiedNum;
    const rampTotal = (p.End_Rocks!=null || p.End_Dorks!=null) ? (p.End_Rocks||0)+(p.End_Dorks||0) : null;
    p.rampPerTurn = (rampTotal!=null && turnsAlive) ? rampTotal/turnsAlive : null;
  });
  function rampStats(names, rowsFor){
    return names.map(name => {
      const rows = rowsFor(name).filter(r=>r.rampPerTurn!=null);
      return { name, games: rows.length, avgRampPerTurn: mean(rows.map(r=>r.rampPerTurn)) };
    }).filter(x=>x.games>0).sort((a,b)=> b.avgRampPerTurn - a.avgRampPerTurn);
  }
  const playerRamp = rampStats(players, name=>perf.filter(p=>p.Player===name));
  const deckRamp = rampStats(decks, name=>perf.filter(p=>p.Deck===name));
  const maxRamp = Math.max(...playerRamp.map(r=>r.avgRampPerTurn), ...deckRamp.map(r=>r.avgRampPerTurn), 0.01);

  // ---------- opening hand lands vs win rate ----------
  // Bucketed across the whole table rather than per deck/player: most decks
  // only have a handful of games, so a per-deck breakdown here would mostly
  // be 1-game buckets with no real signal.
  function landBucket(n){
    if (n==null) return null;
    if (n<=1) return '0-1'; if (n===2) return '2'; if (n===3) return '3'; if (n===4) return '4'; return '5+';
  }
  perf.forEach(p => { p.landBucketLabel = landBucket(p.Opening_Lands); });
  const landOrder = ['0-1','2','3','4','5+'];
  const landStats = landOrder.map(b => {
    const rows = perf.filter(p=>p.landBucketLabel===b);
    const wins = rows.filter(p=>p.isWin).length;
    return { label:b, games:rows.length, wins, winRate: rows.length? wins/rows.length : 0 };
  }).filter(x=>x.games>0);

  // ---------- seat performance: players & decks ----------
  function seatMatrix(names, rowsFor){
    return names.map(name => {
      const rows = rowsFor(name);
      const seats = [1,2,3,4].map(s => {
        const seatRows = rows.filter(r=>r.SeatNum===s);
        const wins = seatRows.filter(r=>r.isWin).length;
        return { games:seatRows.length, winRate: seatRows.length? wins/seatRows.length : null };
      });
      return { name, totalGames: rows.length, seats };
    }).filter(x=>x.totalGames>0).sort((a,b)=>b.totalGames-a.totalGames);
  }
  const playerSeatMatrix = seatMatrix(players, name=>perf.filter(p=>p.Player===name));
  const deckSeatMatrix = seatMatrix(decks, name=>perf.filter(p=>p.Deck===name));

  // ---------- game-length performance: players & decks ----------
  function turnLenBucket(t){
    if (t==null) return null;
    if (t<=5) return '≤5'; if (t<=8) return '6-8'; if (t<=11) return '9-11'; return '12+';
  }
  perf.forEach(p => { p.turnLenBucketLabel = turnLenBucket(p.gameEndTurn); });
  const turnLenOrder = ['≤5','6-8','9-11','12+'];
  function turnLenMatrix(names, rowsFor){
    return names.map(name => {
      const rows = rowsFor(name);
      const buckets = turnLenOrder.map(b => {
        const bRows = rows.filter(r=>r.turnLenBucketLabel===b);
        const wins = bRows.filter(r=>r.isWin).length;
        return { games:bRows.length, winRate: bRows.length? wins/bRows.length : null };
      });
      return { name, totalGames: rows.length, buckets };
    }).filter(x=>x.totalGames>0).sort((a,b)=>b.totalGames-a.totalGames);
  }
  const playerTurnLenMatrix = turnLenMatrix(players, name=>perf.filter(p=>p.Player===name));
  const deckTurnLenMatrix = turnLenMatrix(decks, name=>perf.filter(p=>p.Deck===name));

  // ---------- matrix cell rendering helper ----------
  function matrixCell(cell){
    if (cell.self) return `<td class="self">—</td>`;
    if (cell.empty || cell.winRate == null) return `<td class="empty">—</td>`;
    const bg = `rgba(212,175,55,${(cell.winRate*0.35).toFixed(2)})`;
    return `<td style="background:${bg}">${pct(cell.winRate)}</td>`;
  }
  function matrixTable(rows, colLabels, cellsOf){
    return `<table class="matrix">
      <thead><tr><th class="rowhead"></th>${colLabels.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r => `<tr><th class="rowhead">${r.name}</th>${cellsOf(r).map(matrixCell).join('')}</tr>`).join('')}</tbody>
    </table>`;
  }

  // ================= RENDER =================
  const html = `
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-mark" style="text-decoration:none;"><span class="dot"></span>The Table</a>
      <div class="nav-links">
        <a href="index.html">Overview</a>
        <a href="#turns">Turns</a>
        <a href="#h2h">Head-to-Head</a>
        <a href="#deckrivalries">Deck Rivalries</a>
        <a href="#ramp">Ramp</a>
        <a href="#lands">Opening Lands</a>
        <a href="#seatperf">Seat</a>
        <a href="#lengthperf">Game Length</a>
      </div>
    </div>
  </nav>

  <header class="hero" style="padding:56px 24px 40px;">
    <div class="hero-inner">
      <div class="eyebrow"><span class="line"></span>Commander pod &nbsp;·&nbsp; deeper cuts</div>
      <h1 style="font-size:clamp(28px,4.4vw,44px);">Deep Dive</h1>
      <p class="sub">Everything that didn't fit on the overview — turn-by-turn averages, head-to-head records, ramp speed, opening hands, and how seat and game length swing the numbers. <a href="index.html" style="color:var(--gold-bright);">Back to the overview →</a></p>
    </div>
  </header>

  <section id="turns">
    <div class="wrap">
      <div class="section-head">
        <div><h2>Turn averages</h2><div class="section-desc">How long games run for each player and deck — overall, when they win, and when they're eliminated.</div></div>
        <div class="idx">01 / TURNS</div>
      </div>
      <div class="grid grid-2">
        <div class="panel avg-table">
          <div class="r head"><div>Player</div><div>Game len</div><div>Win turn</div><div>Loss turn</div></div>
          ${playerTurnAvgs.map(p => `
            <div class="r">
              <div><div class="name">${p.name}</div><div class="meta">${p.games} games</div></div>
              <div class="val">${fmt1(p.avgGameLen)}</div>
              <div class="val win">${fmt1(p.avgWinTurn)}</div>
              <div class="val loss">${fmt1(p.avgLossTurn)}</div>
            </div>
          `).join('')}
        </div>
        <div class="panel avg-table">
          <div class="r head"><div>Deck</div><div>Game len</div><div>Win turn</div><div>Loss turn</div></div>
          ${deckTurnAvgs.map(d => `
            <div class="r">
              <div><div class="name">${pipsHTML(deckColorById[d.name])} ${d.name}</div><div class="meta">${d.games} games</div></div>
              <div class="val">${fmt1(d.avgGameLen)}</div>
              <div class="val win">${fmt1(d.avgWinTurn)}</div>
              <div class="val loss">${fmt1(d.avgLossTurn)}</div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  </section>

  <section id="h2h">
    <div class="wrap">
      <div class="section-head">
        <div><h2>Player head-to-head</h2><div class="section-desc">Row player's win rate in decisive games shared with the column player (games won by a third player don't count either way).</div></div>
        <div class="idx">02 / HEAD-TO-HEAD</div>
      </div>
      <div class="panel matrix-wrap" style="padding:16px;">
        ${matrixTable(playerH2HMatrix, players, r => r.cells)}
      </div>
    </div>
  </section>

  <section id="deckrivalries">
    <div class="wrap">
      <div class="section-head">
        <div><h2>Deck rivalries</h2><div class="section-desc">Every deck pair that's shared 2+ tables, and who wins when they do.</div></div>
        <div class="idx">03 / DECK RIVALRIES</div>
      </div>
      <div class="grid grid-2">
        ${deckRivalries.map(r => {
          const total = r.aWins + r.bWins;
          const aPct = total ? (r.aWins/total)*100 : 50;
          return `<div class="panel rivalry-card">
            <div class="rivalry-names"><span>${pipsHTML(deckColorById[r.a])} ${r.a}</span><span class="rivalry-vs">${r.games} shared</span><span>${r.b} ${pipsHTML(deckColorById[r.b])}</span></div>
            <div class="rivalry-track"><div class="rivalry-a" style="width:${aPct}%"></div><div class="rivalry-b" style="width:${100-aPct}%"></div></div>
            <div class="rivalry-meta"><span>${r.aWins} wins</span><span>${total} decisive</span><span>${r.bWins} wins</span></div>
          </div>`;
        }).join('') || '<div class="panel" style="padding:24px;color:var(--text-dim);">Not enough shared games between any two decks yet.</div>'}
      </div>
    </div>
  </section>

  <section id="ramp">
    <div class="wrap">
      <div class="section-head">
        <div><h2>Ramp speed</h2><div class="section-desc">Mana sources (rocks + dorks) per turn survived — how fast each player/deck is actually accelerating, not just how many rocks they end with.</div></div>
        <div class="idx">04 / RAMP</div>
      </div>
      <div class="grid grid-2">
        <div class="panel" style="padding:20px 20px 8px;">
          <h3 style="font-size:11px;color:var(--text-faint);margin-bottom:14px;font-weight:900;text-transform:uppercase;letter-spacing:.14em;">By player</h3>
          ${playerRamp.map(r => `<div class="hbar-row">
            <div class="hbar-label">${r.name}</div>
            <div class="hbar-track"><div class="hbar-fill" style="width:${(r.avgRampPerTurn/maxRamp)*100}%"></div></div>
            <div class="hbar-val">${fmt1(r.avgRampPerTurn)}/t</div>
          </div>`).join('')}
        </div>
        <div class="panel" style="padding:20px 20px 8px;">
          <h3 style="font-size:11px;color:var(--text-faint);margin-bottom:14px;font-weight:900;text-transform:uppercase;letter-spacing:.14em;">By deck</h3>
          ${deckRamp.map(r => `<div class="hbar-row">
            <div class="hbar-label">${r.name}</div>
            <div class="hbar-track"><div class="hbar-fill" style="width:${(r.avgRampPerTurn/maxRamp)*100}%"></div></div>
            <div class="hbar-val">${fmt1(r.avgRampPerTurn)}/t</div>
          </div>`).join('')}
        </div>
      </div>
    </div>
  </section>

  <section id="lands">
    <div class="wrap">
      <div class="section-head">
        <div><h2>Opening hand lands</h2><div class="section-desc">Win rate by how many lands were in the opening hand, across the whole table (too few games per deck to split this one out by deck).</div></div>
        <div class="idx">05 / OPENING LANDS</div>
      </div>
      <div class="panel" style="padding:24px 24px 10px;">
        ${landStats.map(l => `<div class="hbar-row">
          <div class="hbar-label">${l.label} lands</div>
          <div class="hbar-track"><div class="hbar-fill" style="width:${l.winRate*100}%"></div></div>
          <div class="hbar-val">${pct(l.winRate)}</div>
        </div>`).join('')}
      </div>
    </div>
  </section>

  <section id="seatperf">
    <div class="wrap">
      <div class="section-head">
        <div><h2>Seat performance</h2><div class="section-desc">Win rate by seat position — seat 1 goes first each game — broken out per player and per deck.</div></div>
        <div class="idx">06 / SEAT</div>
      </div>
      <div class="panel matrix-wrap" style="padding:16px;margin-bottom:16px;">
        <h3 style="font-size:11px;color:var(--text-faint);margin-bottom:14px;font-weight:900;text-transform:uppercase;letter-spacing:.14em;">By player</h3>
        ${matrixTable(playerSeatMatrix, ['Seat 1','Seat 2','Seat 3','Seat 4'], r => r.seats)}
      </div>
      <div class="panel matrix-wrap" style="padding:16px;">
        <h3 style="font-size:11px;color:var(--text-faint);margin-bottom:14px;font-weight:900;text-transform:uppercase;letter-spacing:.14em;">By deck</h3>
        ${matrixTable(deckSeatMatrix, ['Seat 1','Seat 2','Seat 3','Seat 4'], r => r.seats)}
      </div>
    </div>
  </section>

  <section id="lengthperf">
    <div class="wrap">
      <div class="section-head">
        <div><h2>Performance by game length</h2><div class="section-desc">Win rate bucketed by how long the game ran, per player and per deck.</div></div>
        <div class="idx">07 / GAME LENGTH</div>
      </div>
      <div class="panel matrix-wrap" style="padding:16px;margin-bottom:16px;">
        <h3 style="font-size:11px;color:var(--text-faint);margin-bottom:14px;font-weight:900;text-transform:uppercase;letter-spacing:.14em;">By player</h3>
        ${matrixTable(playerTurnLenMatrix, turnLenOrder, r => r.buckets)}
      </div>
      <div class="panel matrix-wrap" style="padding:16px;">
        <h3 style="font-size:11px;color:var(--text-faint);margin-bottom:14px;font-weight:900;text-transform:uppercase;letter-spacing:.14em;">By deck</h3>
        ${matrixTable(deckTurnLenMatrix, turnLenOrder, r => r.buckets)}
      </div>
    </div>
  </section>

  <footer>
    Reads live from the Game_Summary and Player_Performance tabs · reload the page any time to pull the latest games.
    <br><a href="index.html" style="color:var(--gold-bright);font-size:12px;">← Back to overview</a>
    &nbsp;&nbsp;<button class="refresh-btn" onclick="location.reload()">Refresh data</button>
  </footer>
  `;

  document.getElementById('app').innerHTML = html;
}

init();
</script>
