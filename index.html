<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Table — Commander Stats</title>
<style>
:root{
  --bg:#000000;
  --panel: rgba(255,255,255,0.045);
  --panel-hover: rgba(255,255,255,0.07);
  --line: rgba(255,255,255,0.1);
  --line-soft: rgba(255,255,255,0.06);
  --text:#ffffff;
  --text-dim: rgba(255,255,255,0.6);
  --text-faint: rgba(255,255,255,0.4);
  --text-ghost: rgba(255,255,255,0.22);
  --gold:#D4AF37;
  --gold-bright:#e8cf7a;
  --blue:#38bdf8;
  --win:#3ecf8e;
  --loss:#ef4444;
  --ink:#0a0a0a;
  --w:#F4EFDD; --u:#3E7FC1; --b:#4A4750; --r:#B8402F; --g:#3C7A4C; --c:#9A958A;
  --radius:20px;
  --radius-sm:14px;
  --shadow: 0 10px 30px rgba(0,0,0,0.6);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height:1.5;
  min-height:100vh;
}

::selection{ background:var(--gold); color:var(--ink); }

a{ color:inherit; }

.wrap{ max-width:1180px; margin:0 auto; padding:0 24px; }

h1,h2,h3{ font-family:inherit; font-weight:900; margin:0; letter-spacing:-0.01em; }

/* ---------- Nav ---------- */
.nav{
  position:sticky; top:0; z-index:50;
  background:rgba(0,0,0,0.9);
  backdrop-filter: blur(14px);
  border-bottom:1px solid var(--line);
}
.nav-inner{
  max-width:1180px; margin:0 auto; padding:14px 24px;
  display:flex; align-items:center; gap:22px; flex-wrap:wrap;
}
.nav-mark{
  font-weight:900; font-size:14px; text-transform:uppercase; letter-spacing:.16em; color:var(--text);
  display:flex; align-items:center; gap:9px; white-space:nowrap;
}
.nav-mark .dot{ width:7px;height:7px;border-radius:50%;background:var(--gold); box-shadow:0 0 10px var(--gold);}
.nav-links{ display:flex; gap:4px; flex-wrap:wrap; margin-left:auto; }
.nav-links a{
  font-size:11px; text-decoration:none; color:var(--text-dim);
  padding:8px 14px; border-radius:999px; transition:all .18s ease;
  font-weight:900; letter-spacing:.08em; text-transform:uppercase;
  background:var(--panel); border:1px solid transparent;
}
.nav-links a:hover, .nav-links a:focus-visible{ background:var(--panel-hover); color:var(--text); border-color:var(--line); outline:none; }

/* ---------- Hero ---------- */
.hero{
  padding:72px 24px 56px; position:relative; overflow:hidden;
}
.hero-pips{ position:absolute; inset:0; pointer-events:none; opacity:0.4; }
.floatpip{
  position:absolute; border-radius:50%; opacity:0.12; filter:blur(1px);
  animation: drift 14s ease-in-out infinite;
}
@keyframes drift{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-18px) } }
@media (prefers-reduced-motion: reduce){ .floatpip{ animation:none; } html{scroll-behavior:auto;} }

.hero-inner{ max-width:1180px; margin:0 auto; position:relative; }
.eyebrow{
  font-size:11px; letter-spacing:.3em; text-transform:uppercase; font-weight:900;
  color:var(--text-faint); margin-bottom:18px; display:flex; align-items:center; gap:10px;
}
.eyebrow .line{ width:28px; height:1px; background:var(--gold); opacity:.7; }
.hero h1{
  font-size:clamp(34px, 5.6vw, 58px); line-height:1.05; color:var(--text);
  max-width:820px; font-weight:900;
}
.hero h1 em{ font-style:normal; color:var(--gold-bright); }
.hero p.sub{
  margin-top:18px; max-width:560px; font-size:15.5px; color:var(--text-dim);
}
.hero-stats{
  margin-top:44px; display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px; max-width:920px;
}
.hero-stat{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-sm); padding:18px 20px; }
.hero-stat .num{ font-size:28px; font-weight:900; color:var(--text); text-shadow:0 2px 16px rgba(0,0,0,0.6); }
.hero-stat .lbl{ font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.14em; margin-top:5px; font-weight:900; }

/* ---------- Sections ---------- */
section{ padding:64px 0; border-top:1px solid var(--line-soft); }
.section-head{ display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:32px; }
.section-head h2{ font-size:24px; color:var(--text); font-weight:900; }
.section-head .idx{ color:var(--gold); font-size:11px; letter-spacing:.18em; font-weight:900; text-transform:uppercase; }
.section-desc{ color:var(--text-dim); font-size:14px; max-width:560px; margin-top:6px; }

/* ---------- Cards / panels ---------- */
.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  backdrop-filter: blur(16px);
  position:relative;
}
.grid{ display:grid; gap:14px; }
.grid-2{ grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); }
.grid-3{ grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }

/* Leaderboard */
.leader-card{ padding:20px; display:flex; gap:16px; align-items:center; }
.life-badge{
  flex:none; width:62px; height:62px; border-radius:50%;
  background:rgba(255,255,255,0.06);
  border:2px solid var(--gold);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  box-shadow: inset 0 0 14px rgba(0,0,0,0.5);
}
.life-badge .n{ font-weight:900; font-size:20px; color:var(--win); line-height:1; text-shadow:0 1px 10px rgba(0,0,0,0.6); }
.life-badge .l{ font-size:8px; color:var(--text-faint); letter-spacing:.1em; margin-top:3px; font-weight:900; }
.leader-info{ flex:1; min-width:0; }
.leader-name{ font-weight:900; font-size:16px; color:var(--text); }
.leader-sub{ font-size:12px; color:var(--text-dim); margin-top:3px; }
.rank-tag{
  font-size:10px; color:var(--ink); background:var(--gold);
  border-radius:999px; padding:2px 8px; font-weight:900; margin-right:8px; letter-spacing:.04em;
}
.bar-track{ height:6px; border-radius:999px; background:rgba(255,255,255,0.08); margin-top:10px; overflow:hidden; }
.bar-fill{ height:100%; border-radius:999px; background:linear-gradient(90deg, var(--blue), var(--gold)); }

/* Mana pips */
.pips{ display:inline-flex; gap:3px; vertical-align:middle; }
.pip{
  width:17px; height:17px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
  font-size:9px; font-weight:900; color:var(--ink);
  border:1px solid rgba(0,0,0,0.35); flex:none;
}

/* Table-ish list rows */
.rowlist{ display:flex; flex-direction:column; }
.rowlist .r{
  display:grid; grid-template-columns: 28px 1fr auto; gap:12px; align-items:center;
  padding:13px 20px; border-top:1px solid var(--line-soft);
}
.rowlist .r:first-child{ border-top:none; }
.rowlist .r .pos{ color:var(--gold); font-size:12px; font-weight:900; }
.rowlist .r .main{ min-width:0; }
.rowlist .r .name{ font-weight:900; font-size:15px; color:var(--text); }
.rowlist .r .meta{ font-size:11.5px; color:var(--text-dim); margin-top:3px; }
.rowlist .r .stat{ text-align:right; }
.rowlist .r .stat .big{ font-size:16px; color:var(--text); font-weight:900; }
.rowlist .r .stat .small{ font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.08em; font-weight:900; }

/* Seat / mulligan bars */
.hbar-row{ display:flex; align-items:center; gap:14px; padding:10px 0; }
.hbar-label{ width:120px; flex:none; font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; font-weight:900; }
.hbar-track{ flex:1; height:20px; background:rgba(255,255,255,0.06); border-radius:999px; overflow:hidden; position:relative; }
.hbar-fill{ height:100%; border-radius:999px; background:linear-gradient(90deg, var(--blue), var(--gold)); display:flex; align-items:center; }
.hbar-val{ width:56px; flex:none; text-align:right; font-size:13px; color:var(--text); font-weight:900; }

/* Awards */
.award-card{ padding:22px; }
.award-card .k{ font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.14em; font-weight:900; }
.award-card .v{ font-size:22px; color:var(--text); margin-top:9px; font-weight:900; text-shadow:0 2px 16px rgba(0,0,0,0.6); }
.award-card .d{ font-size:12px; color:var(--text-dim); margin-top:6px; }

/* trend */
.trend-wrap{ padding:24px 20px 16px; }
.trend-bars{ display:flex; align-items:flex-end; gap:6px; height:140px; }
.tbar{ flex:1; background:linear-gradient(180deg, var(--gold-bright), var(--blue)); border-radius:4px 4px 0 0; position:relative; min-width:8px; }
.tbar .tt{
  position:absolute; bottom:100%; left:50%; transform:translateX(-50%); margin-bottom:6px;
  font-size:10px; font-weight:900; color:var(--text); white-space:nowrap; opacity:0; transition:opacity .15s;
  background:rgba(0,0,0,0.9); padding:3px 7px; border-radius:999px; border:1px solid var(--line);
}
.tbar:hover .tt, .tbar:focus-visible .tt, .tbar.tt-open .tt{ opacity:1; }
.trend-axis{ display:flex; gap:6px; margin-top:8px; }
.trend-axis span{ flex:1; text-align:center; font-size:9.5px; color:var(--text-faint); min-width:8px; font-weight:700; }

/* rivalry */
.rivalry-card{ padding:20px; }
.rivalry-names{ display:flex; align-items:center; justify-content:space-between; font-weight:900; font-size:15px; }
.rivalry-vs{ font-size:10px; color:var(--text-faint); font-weight:900; text-transform:uppercase; letter-spacing:.08em; }
.rivalry-track{ display:flex; height:10px; border-radius:999px; overflow:hidden; margin-top:12px; background:rgba(255,255,255,0.06); }
.rivalry-a{ background:var(--gold); }
.rivalry-b{ background:var(--blue); }
.rivalry-meta{ display:flex; justify-content:space-between; margin-top:8px; font-size:11px; color:var(--text-dim); font-weight:700; }

/* toggle */
.toggle{ display:inline-flex; background:var(--panel); border-radius:999px; padding:3px; border:1px solid var(--line); }
.toggle button{
  border:none; background:transparent; color:var(--text-dim);
  font-size:11px; font-weight:900; text-transform:uppercase; letter-spacing:.06em;
  padding:8px 16px; border-radius:999px; cursor:pointer; transition:all .15s;
}
.toggle button.active{ background:var(--gold); color:var(--ink); }
.toggle button:focus-visible{ outline:2px solid var(--gold-bright); outline-offset:2px; }

/* state screens */
.state-screen{ min-height:70vh; display:flex; align-items:center; justify-content:center; flex-direction:column; padding:40px 24px; text-align:center; }
.spinner{
  width:32px; height:32px; border-radius:50%; border:2px solid rgba(255,255,255,0.12); border-top-color:var(--gold);
  animation:spin 0.9s linear infinite; margin-bottom:20px;
}
@keyframes spin{ to{ transform:rotate(360deg); } }
.state-screen h2{ font-size:18px; color:var(--text); font-weight:900; text-transform:uppercase; letter-spacing:.04em; }
.state-screen p{ color:var(--text-dim); max-width:460px; margin-top:10px; font-size:13.5px; }
.retry-btn{
  margin-top:20px; background:var(--gold); color:var(--ink); border:none; padding:11px 22px;
  border-radius:999px; font-weight:900; cursor:pointer; font-family:inherit; font-size:12px;
  text-transform:uppercase; letter-spacing:.08em;
}
.retry-btn:hover{ background:var(--gold-bright); }
code.inline{ background:rgba(255,255,255,0.06); padding:2px 7px; border-radius:6px; font-size:12px; color:var(--gold-bright); }

footer{ padding:40px 24px 60px; text-align:center; color:var(--text-faint); font-size:12px; }
footer .refresh-btn{
  background:var(--panel); border:1px solid var(--line); color:var(--text);
  padding:9px 18px; border-radius:999px; font-size:11px; font-weight:900; text-transform:uppercase; letter-spacing:.08em;
  cursor:pointer; margin-top:14px;
}
footer .refresh-btn:hover{ background:var(--panel-hover); }

@media (max-width:640px){
  .nav-links{ display:none; }
  .rowlist .r{ grid-template-columns: 20px 1fr auto; padding:12px 16px; }
  .hbar-label{ width:88px; font-size:10.5px; }
}
</style>
</head>
<body>

<div id="app">
  <div class="state-screen" id="loadingScreen">
    <div class="spinner"></div>
    <h2>Shuffling the data in…</h2>
    <p>Pulling live results from the scorekeeping sheet.</p>
  </div>
</div>

<template id="errorTemplate">
  <div class="state-screen">
    <h2>Couldn't reach the sheet</h2>
    <p>
      This page reads live from your Google Sheet, which needs to be shared as
      <strong>"Anyone with the link — Viewer."</strong>
      In the sheet, click <em>Share</em>, set general access to "Anyone with the link," then reload this page.
    </p>
    <p style="margin-top:14px;">Sheet ID in use: <code class="inline">__SHEET_ID__</code></p>
    <button class="retry-btn" onclick="location.reload()">Try again</button>
  </div>
</template>

<script>
const SHEET_ID = '18_9UkJ3MAsNw4ByOGFDqOBE2u1gnpxQSR3tPi-_9i3I';
const GAME_TAB = 'Game_Summary';
const PLAYER_TAB = 'Player_Performance';

const MANA_COLORS = { W:'#F4EFDD', U:'#3E7FC1', B:'#4A4750', R:'#B8402F', G:'#3C7A4C', C:'#9A958A' };

function gvizUrl(sheetName){
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
}

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ','){ row.push(field); field=''; }
      else if (c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if (c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length===1 && r[0] !== ''));
}

function rowsToObjects(rows){
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).map(r => {
    const obj = {};
    headers.forEach((h,i) => obj[h] = (r[i] !== undefined ? r[i].trim() : ''));
    return obj;
  });
}

async function fetchSheet(name){
  const res = await fetch(gvizUrl(name));
  if (!res.ok) throw new Error('fetch-failed');
  const text = await res.text();
  if (text.trim().startsWith('<')) throw new Error('not-public');
  return rowsToObjects(parseCSV(text));
}

function mean(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null; }
function fmt1(n){ return n === null || n === undefined || isNaN(n) ? '—' : n.toFixed(1); }
function pct(n){ return n === null || isNaN(n) ? '—' : Math.round(n*100) + '%'; }

function pipsHTML(colorId){
  if (!colorId) return `<span class="pips"><span class="pip" style="background:${MANA_COLORS.C}">C</span></span>`;
  const chars = colorId.replace(/[^WUBRG]/gi,'').toUpperCase().split('');
  const uniq = [...new Set(chars)];
  if (!uniq.length) return `<span class="pips"><span class="pip" style="background:${MANA_COLORS.C}">C</span></span>`;
  return `<span class="pips">` + uniq.map(c => `<span class="pip" style="background:${MANA_COLORS[c]}">${c}</span>`).join('') + `</span>`;
}

function monthLabel(ts){
  const d = new Date(ts.replace(' ','T'));
  if (isNaN(d)) return null;
  return d.toLocaleString('en-US', { month:'short', year:'2-digit' });
}

async function init(){
  let games, perf;
  try{
    [games, perf] = await Promise.all([fetchSheet(GAME_TAB), fetchSheet(PLAYER_TAB)]);
    if (!games.length || !perf.length) throw new Error('empty');
  } catch(e){
    const tpl = document.getElementById('errorTemplate').innerHTML.replace('__SHEET_ID__', SHEET_ID);
    document.getElementById('app').innerHTML = tpl;
    return;
  }
  render(games, perf);
}

function render(games, perf){
  // ---------- normalize ----------
  games = games.filter(g => g.GameID);
  perf = perf.filter(p => p.GameID && p.Player);
  games.forEach(g => { g.End_Turn = parseFloat(g.End_Turn) || null; });
  perf.forEach(p => {
    p.Opening_Lands = parseFloat(p.Opening_Lan ?? p.Opening_Lands) || null;
    p.End_Lands = parseFloat(p.End_Lands) || null;
    p.End_Rocks = p.End_Rocks === '' ? null : parseFloat(p.End_Rocks);
    p.End_Dorks = p.End_Dorks === '' ? null : parseFloat(p.End_Dorks);
    p.isWin = (p.Turn_Died || '').toLowerCase().trim() === 'win';
    p.turnDiedNum = p.isWin ? null : (parseFloat(p.Turn_Died) || null);
    p.SeatNum = parseFloat(p.Seat_Position) || null;
  });

  const totalGames = games.length;
  const players = [...new Set(perf.map(p => p.Player))].filter(Boolean);
  const decks = [...new Set(perf.map(p => p.Deck))].filter(Boolean);
  const avgTurn = mean(games.map(g=>g.End_Turn).filter(x=>x));
  const longest = games.reduce((a,b)=> (b.End_Turn||0) > (a.End_Turn||0) ? b : a, games[0]);
  const shortest = games.reduce((a,b)=> (b.End_Turn||999) < (a.End_Turn||999) ? b : a, games[0]);
  const dateSorted = [...games].filter(g=>g.Timestamp).sort((a,b)=> new Date(a.Timestamp) - new Date(b.Timestamp));
  const mostRecent = dateSorted[dateSorted.length-1];

  // ---------- players ----------
  const playerStats = players.map(name => {
    const rows = perf.filter(p => p.Player === name);
    const wins = rows.filter(p => p.isWin).length;
    const gamesPlayed = rows.length;
    const survivalTurns = rows.map(p=>p.turnDiedNum).filter(x=>x);
    const deckSet = new Set(rows.map(r=>r.Deck).filter(Boolean));
    const colorCounts = {};
    rows.forEach(r => { if(r.Color_ID){ colorCounts[r.Color_ID] = (colorCounts[r.Color_ID]||0)+1; } });
    const favColor = Object.entries(colorCounts).sort((a,b)=>b[1]-a[1])[0];
    return {
      name, gamesPlayed, wins,
      winRate: gamesPlayed ? wins/gamesPlayed : 0,
      avgSurvival: mean(survivalTurns),
      deckCount: deckSet.size,
      favColor: favColor ? favColor[0] : null
    };
  }).filter(p => p.gamesPlayed > 0)
    .sort((a,b) => b.winRate - a.winRate || b.gamesPlayed - a.gamesPlayed);

  // ---------- seats ----------
  const seatTotals = {1:0,2:0,3:0,4:0};
  perf.forEach(p => { if (seatTotals[p.SeatNum] !== undefined) seatTotals[p.SeatNum]++; });
  const seatWins = {1:0,2:0,3:0,4:0};
  games.forEach(g => { const s = parseFloat(g.Winner_Seat); if (seatWins[s] !== undefined) seatWins[s]++; });

  // ---------- decks ----------
  const deckStats = decks.map(name => {
    const rows = perf.filter(p => p.Deck === name);
    const wins = rows.filter(p=>p.isWin).length;
    const gamesPlayed = rows.length;
    const ramp = rows.map(r => (r.End_Rocks||0) + (r.End_Dorks||0)).filter((x,i)=> rows[i].End_Rocks!==null || rows[i].End_Dorks!==null);
    const deathTurns = rows.map(r=>r.turnDiedNum).filter(x=>x);
    const colorId = rows.find(r=>r.Color_ID)?.Color_ID || '';
    const owner = rows.find(r=>r.Owner)?.Owner || rows[0]?.Player || '';
    return {
      name, owner, gamesPlayed, wins,
      winRate: gamesPlayed ? wins/gamesPlayed : 0,
      avgDeathTurn: mean(deathTurns),
      avgRamp: mean(ramp),
      colorId
    };
  }).filter(d => d.gamesPlayed > 0)
    .sort((a,b) => b.winRate - a.winRate || b.gamesPlayed - a.gamesPlayed);

  // ---------- color identity ----------
  const colorMap = {};
  perf.forEach(p => {
    if (!p.Color_ID) return;
    const key = p.Color_ID;
    if (!colorMap[key]) colorMap[key] = { games:0, wins:0 };
    colorMap[key].games++;
    if (p.isWin) colorMap[key].wins++;
  });
  const colorStats = Object.entries(colorMap).map(([id, v]) => ({
    id, games:v.games, wins:v.wins, winRate: v.games ? v.wins/v.games : 0
  })).sort((a,b)=> b.winRate - a.winRate || b.games - a.games);

  const colorCountMap = {};
  perf.forEach(p => {
    if (!p.Color_ID) return;
    const n = new Set(p.Color_ID.replace(/[^WUBRG]/gi,'').toUpperCase().split('')).size;
    const key = n === 0 ? 'Colorless' : n===1 ? 'Mono' : n===2 ? '2-Color' : n===3 ? '3-Color' : n===4 ? '4-Color' : '5-Color';
    if (!colorCountMap[key]) colorCountMap[key] = { games:0, wins:0 };
    colorCountMap[key].games++;
    if (p.isWin) colorCountMap[key].wins++;
  });
  const order = ['Colorless','Mono','2-Color','3-Color','4-Color','5-Color'];
  const colorCountStats = order.filter(k=>colorCountMap[k]).map(k => ({
    label:k, games:colorCountMap[k].games, wins:colorCountMap[k].wins,
    winRate: colorCountMap[k].wins/colorCountMap[k].games
  }));

  // ---------- mulligans ----------
  const mullMap = {};
  games.forEach(g => {
    const t = g.Muilligan_Type || g.Mulligan_Type || 'Unknown';
    if (!mullMap[t]) mullMap[t] = { count:0, turns:[] };
    mullMap[t].count++;
    if (g.End_Turn) mullMap[t].turns.push(g.End_Turn);
  });
  const mullStats = Object.entries(mullMap).map(([type,v]) => ({
    type, count:v.count, pct: v.count/totalGames, avgTurn: mean(v.turns)
  })).sort((a,b)=> b.count - a.count);

  // ---------- trend by month ----------
  const monthMap = {};
  dateSorted.forEach(g => {
    const label = monthLabel(g.Timestamp);
    if (!label) return;
    if (!monthMap[label]) monthMap[label] = { count:0, turns:[] };
    monthMap[label].count++;
    if (g.End_Turn) monthMap[label].turns.push(g.End_Turn);
  });
  const monthStats = Object.entries(monthMap).map(([label,v]) => ({ label, count:v.count, avgTurn: mean(v.turns) }));

  // ---------- awards ----------
  const noWinPlayers = playerStats.filter(p => p.wins === 0 && p.gamesPlayed >= 2).sort((a,b)=>b.gamesPlayed-a.gamesPlayed)[0];

  // ---------- rivalries ----------
  const pairMap = {};
  const byGame = {};
  perf.forEach(p => { (byGame[p.GameID] = byGame[p.GameID] || []).push(p.Player); });
  const winnerByGame = {};
  games.forEach(g => winnerByGame[g.GameID] = g.Winner_Player);
  Object.entries(byGame).forEach(([gid, plist]) => {
    const uniq = [...new Set(plist)];
    for (let i=0;i<uniq.length;i++){
      for (let j=i+1;j<uniq.length;j++){
        const [a,b] = [uniq[i], uniq[j]].sort();
        const key = a+'|||'+b;
        if (!pairMap[key]) pairMap[key] = { a, b, games:0, aWins:0, bWins:0 };
        pairMap[key].games++;
        const w = winnerByGame[gid];
        if (w === a) pairMap[key].aWins++;
        else if (w === b) pairMap[key].bWins++;
      }
    }
  });
  const rivalries = Object.values(pairMap).sort((a,b)=> b.games - a.games).slice(0,4);

  // ================= RENDER =================
  const maxWinRate = Math.max(...playerStats.map(p=>p.winRate), 0.01);
  const maxSeatRate = Math.max(...[1,2,3,4].map(s => seatTotals[s] ? seatWins[s]/seatTotals[s] : 0), 0.01);
  const maxMonthCount = Math.max(...monthStats.map(m=>m.count), 1);

  const html = `
  <nav class="nav">
    <div class="nav-inner">
      <div class="nav-mark"><span class="dot"></span>The Table</div>
      <div class="nav-links">
        <a href="#players">Players</a>
        <a href="#seats">Seats</a>
        <a href="#decks">Decks</a>
        <a href="#colors">Colors</a>
        <a href="#mulligans">Mulligans</a>
        <a href="#trend">Trend</a>
        <a href="#awards">Awards</a>
        <a href="#rivalries">Rivalries</a>
      </div>
    </div>
  </nav>

  <header class="hero">
    <div class="hero-pips" aria-hidden="true">
      ${['W','U','B','R','G'].map((c,i) => `<div class="floatpip" style="width:${60+i*14}px;height:${60+i*14}px;background:${MANA_COLORS[c]};left:${8+i*20}%;top:${10+ (i%3)*22}%;animation-delay:${i*1.3}s;"></div>`).join('')}
    </div>
    <div class="hero-inner">
      <div class="eyebrow"><span class="line"></span>Commander pod &nbsp;·&nbsp; live from the scorekeeping sheet</div>
      <h1>${totalGames} games on record.<br><em>${players.length} players</em>, ${decks.length} decks, one long-running rivalry.</h1>
      <p class="sub">Every mulligan, every ramp piece, every turn someone died with their commander still in the graveyard — tracked and tallied below.</p>
      <div class="hero-stats">
        <div class="hero-stat"><div class="num">${totalGames}</div><div class="lbl">Games logged</div></div>
        <div class="hero-stat"><div class="num">${fmt1(avgTurn)}</div><div class="lbl">Avg. end turn</div></div>
        <div class="hero-stat"><div class="num">${decks.length}</div><div class="lbl">Unique decks</div></div>
        <div class="hero-stat"><div class="num">${players.length}</div><div class="lbl">Players</div></div>
        <div class="hero-stat"><div class="num">${mostRecent ? mostRecent.Winner_Player : '—'}</div><div class="lbl">Reigning winner</div></div>
      </div>
    </div>
  </header>

  <section id="players">
    <div class="wrap">
      <div class="section-head">
        <div><h2>Player leaderboard</h2><div class="section-desc">Win rate across every logged game, best record first.</div></div>
        <div class="idx">01 / PLAYERS</div>
      </div>
      <div class="grid grid-2">
        ${playerStats.map((p,i) => `
          <div class="panel leader-card">
            <div class="life-badge"><div class="n">${p.wins}</div><div class="l">WINS</div></div>
            <div class="leader-info">
              <div class="leader-name"><span class="rank-tag">#${i+1}</span>${p.name}</div>
              <div class="leader-sub">${p.gamesPlayed} games · ${pct(p.winRate)} win rate · avg out turn ${fmt1(p.avgSurvival)}${p.favColor ? ' · ' + pipsHTML(p.favColor) : ''}</div>
              <div class="bar-track"><div class="bar-fill" style="width:${(p.winRate/maxWinRate)*100}%"></div></div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  </section>

  <section id="seats">
    <div class="wrap">
      <div class="section-head">
        <div><h2>Does seat matter?</h2><div class="section-desc">Win rate by turn order — seat 1 goes first each game.</div></div>
        <div class="idx">02 / SEATS</div>
      </div>
      <div class="panel" style="padding:24px 24px 10px;">
        ${[1,2,3,4].map(s => {
          const rate = seatTotals[s] ? seatWins[s]/seatTotals[s] : 0;
          return `<div class="hbar-row">
            <div class="hbar-label">Seat ${s}</div>
            <div class="hbar-track"><div class="hbar-fill" style="width:${(rate/maxSeatRate)*100}%"></div></div>
            <div class="hbar-val">${pct(rate)}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
  </section>

  <section id="decks">
    <div class="wrap">
      <div class="section-head">
        <div><h2>Deck performance</h2><div class="section-desc">Every deck that's hit the table, ranked by win rate (min. 1 game).</div></div>
        <div class="idx">03 / DECKS</div>
      </div>
      <div class="panel rowlist">
        ${deckStats.map((d,i) => `
          <div class="r">
            <div class="pos">${i+1}</div>
            <div class="main">
              <div class="name">${pipsHTML(d.colorId)} &nbsp;${d.name}</div>
              <div class="meta">piloted by ${d.owner} · ${d.gamesPlayed} game${d.gamesPlayed===1?'':'s'}${d.avgRamp!==null ? ' · avg ramp ' + fmt1(d.avgRamp) : ''}</div>
            </div>
            <div class="stat"><div class="big">${pct(d.winRate)}</div><div class="small">${d.wins}W · avg out T${fmt1(d.avgDeathTurn)}</div></div>
          </div>
        `).join('')}
      </div>
    </div>
  </section>

  <section id="colors">
    <div class="wrap">
      <div class="section-head">
        <div><h2>Color identity</h2><div class="section-desc">Win rate by color count and by exact identity (min. data shown as logged).</div></div>
        <div class="idx">04 / COLORS</div>
      </div>
      <div class="grid grid-2">
        <div class="panel" style="padding:22px 24px;">
          <h3 style="font-size:11px;color:var(--text-faint);margin-bottom:16px;font-weight:900;text-transform:uppercase;letter-spacing:.14em;">By color count</h3>
          ${colorCountStats.map(c => `<div class="hbar-row">
            <div class="hbar-label">${c.label}</div>
            <div class="hbar-track"><div class="hbar-fill" style="width:${c.winRate*100}%"></div></div>
            <div class="hbar-val">${pct(c.winRate)}</div>
          </div>`).join('')}
        </div>
        <div class="panel rowlist" style="max-height:340px;overflow-y:auto;">
          ${colorStats.slice(0,10).map((c,i) => `
            <div class="r" style="grid-template-columns:28px 1fr auto;">
              <div class="pos">${i+1}</div>
              <div class="main">${pipsHTML(c.id)}</div>
              <div class="stat"><div class="big">${pct(c.winRate)}</div><div class="small">${c.wins}/${c.games}</div></div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  </section>

  <section id="mulligans">
    <div class="wrap">
      <div class="section-head">
        <div><h2>Mulligan habits</h2><div class="section-desc">How the eventual winner mulliganed, per game.</div></div>
        <div class="idx">05 / MULLIGANS</div>
      </div>
      <div class="panel" style="padding:24px 24px 10px;">
        ${mullStats.map(m => `<div class="hbar-row">
          <div class="hbar-label">${m.type}</div>
          <div class="hbar-track"><div class="hbar-fill" style="width:${m.pct*100}%"></div></div>
          <div class="hbar-val">${m.count}×</div>
        </div>`).join('')}
      </div>
    </div>
  </section>

  <section id="trend">
    <div class="wrap">
      <div class="section-head">
        <div><h2>Pod activity</h2><div class="section-desc">Games played per month, and how long games are running.</div></div>
        <div class="idx">06 / TREND</div>
      </div>
      <div class="panel trend-wrap">
        <div class="trend-bars">
          ${monthStats.map(m => `<div class="tbar" style="height:${(m.count/maxMonthCount)*100}%"><div class="tt">${m.count} games · avg T${fmt1(m.avgTurn)}</div></div>`).join('')}
        </div>
        <div class="trend-axis">${monthStats.map(m => `<span>${m.label}</span>`).join('')}</div>
      </div>
    </div>
  </section>

  <section id="awards">
    <div class="wrap">
      <div class="section-head">
        <div><h2>Table awards</h2><div class="section-desc">The extremes, pulled straight from the log.</div></div>
        <div class="idx">07 / AWARDS</div>
      </div>
      <div class="grid grid-3">
        <div class="panel award-card">
          <div class="k">Fastest win</div>
          <div class="v">Turn ${fmt1(shortest.End_Turn)}</div>
          <div class="d">${shortest.Winner_Player} with ${shortest.Winner_Deck}</div>
        </div>
        <div class="panel award-card">
          <div class="k">Longest grind</div>
          <div class="v">Turn ${fmt1(longest.End_Turn)}</div>
          <div class="d">${longest.Winner_Player} with ${longest.Winner_Deck}</div>
        </div>
        <div class="panel award-card">
          <div class="k">Reigning champion</div>
          <div class="v">${mostRecent ? mostRecent.Winner_Player : '—'}</div>
          <div class="d">${mostRecent ? 'Won most recently with ' + mostRecent.Winner_Deck : ''}</div>
        </div>
        ${noWinPlayers ? `<div class="panel award-card">
          <div class="k">Still chasing the first</div>
          <div class="v">${noWinPlayers.name}</div>
          <div class="d">${noWinPlayers.gamesPlayed} games, no wins yet</div>
        </div>` : ''}
        <div class="panel award-card">
          <div class="k">Average game length</div>
          <div class="v">${fmt1(avgTurn)} turns</div>
          <div class="d">across ${totalGames} logged games</div>
        </div>
        <div class="panel award-card">
          <div class="k">Most active pilot</div>
          <div class="v">${playerStats.slice().sort((a,b)=>b.gamesPlayed-a.gamesPlayed)[0]?.name || '—'}</div>
          <div class="d">${playerStats.slice().sort((a,b)=>b.gamesPlayed-a.gamesPlayed)[0]?.gamesPlayed || 0} games played</div>
        </div>
      </div>
    </div>
  </section>

  <section id="rivalries">
    <div class="wrap">
      <div class="section-head">
        <div><h2>Recurring rivalries</h2><div class="section-desc">Players who've shared the most tables, and who's winning when they do.</div></div>
        <div class="idx">08 / RIVALRIES</div>
      </div>
      <div class="grid grid-2">
        ${rivalries.map(r => {
          const total = r.aWins + r.bWins;
          const aPct = total ? (r.aWins/total)*100 : 50;
          return `<div class="panel rivalry-card">
            <div class="rivalry-names"><span>${r.a}</span><span class="rivalry-vs">${r.games} shared games</span><span>${r.b}</span></div>
            <div class="rivalry-track"><div class="rivalry-a" style="width:${aPct}%"></div><div class="rivalry-b" style="width:${100-aPct}%"></div></div>
            <div class="rivalry-meta"><span>${r.aWins} wins</span><span>${total} decisive</span><span>${r.bWins} wins</span></div>
          </div>`;
        }).join('')}
      </div>
    </div>
  </section>

  <footer>
    Reads live from the Game_Summary and Player_Performance tabs · reload the page any time to pull the latest games.
    <br><button class="refresh-btn" onclick="location.reload()">Refresh data</button>
  </footer>
  `;

  document.getElementById('app').innerHTML = html;
}

init();
</script>
</body>
</html>
